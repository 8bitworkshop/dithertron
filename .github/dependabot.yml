version: 2
updates:
  # Keep GitHub Actions pinned to full-length SHAs up to date.
  # Dependabot rewrites the SHA and the trailing "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
